apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'

android {
    compileSdkVersion 30

    defaultConfig {
        applicationId "com.aipuls.tool"
        minSdkVersion 24
        targetSdkVersion 30
        versionCode 28011
        versionName "2.8.1"
    }

    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
            storeFile file('../signature.jks')
            keyAlias 'xiangfen'
            keyPassword 'xiangfen666888'
            storePassword 'xiangfen666888'
        }
        release {
            // V1（Jar Signature）与V2（Full APK Signature）
            v1SigningEnabled true
            v2SigningEnabled true
            storeFile file('../signature.jks')
            keyAlias 'xiangfen'
            keyPassword 'xiangfen666888'
            storePassword 'xiangfen666888'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation project(':baselibrary')
    implementation project(':floatwindow')
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])

    //友盟统计SDK
    implementation  'com.umeng.umsdk:common:9.4.7'// 必选
    implementation  'com.umeng.umsdk:asms:1.4.1'// 必选
    implementation 'com.umeng.umsdk:apm:1.5.2' // 错误分析升级为独立SDK，看crash数据请一定集成，可选
}